apply_tou_programs:
  name: Write inverter control state
  description: >-
    Write the current battery control state to the inverter's six TOU programs,
    through the Solarman integration. The program start times are left
    untouched. Requires writes to be enabled in the battery settings and an
    explicit confirmation.
  fields:
    entry_id:
      name: Config entry
      description: >-
        The KD Helios entry whose battery plan should be written.
      required: true
      example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
      selector:
        config_entry:
          integration: kd_helios
    confirm:
      name: Confirm
      description: >-
        Must be true. Writing changes how the battery behaves.
      required: true
      example: true
      selector:
        boolean:
